name: FieldMeasure v1.3 Wall and Room Constraints Android APK
on:
  push:
    branches:
      - fieldmeasure-v1-3-walls-locks
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore baseline and layer v1.2 and v1.3
        shell: bash
        run: |
          set -euo pipefail
          cat fieldmeasure_build/part_*.b64 | base64 -d > /tmp/source.tar.xz
          echo 'b25c9144d233df08e823506ccc6edfaedd527321174b108d05127467ff6aca15  /tmp/source.tar.xz' | sha256sum -c -
          mkdir -p app_project
          tar -xJf /tmp/source.tar.xz -C app_project
          cp fieldmeasure_build/overrides/*.java app_project/app/src/main/java/com/fieldmeasure/ar/
          base64 -d fieldmeasure_build/v12_patch.tar.xz.b64 > /tmp/v12.tar.xz
          echo '8793f881fcba72cda818f5114829148039cc8385f805c4ad624e31ff9587e35a  /tmp/v12.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v12.tar.xz -C app_project
          base64 -d fieldmeasure_build/v13_delta.tar.xz.b64 > /tmp/v13.tar.xz
          echo '79061f0de7501ffb46f7d1f8f74b946d9b6ee0d515cf9656f52e9da31344bc58  /tmp/v13.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v13.tar.xz -C app_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK available
        shell: bash
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then sdkmanager 'platforms;android-36'; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Parametric geometry and constraints tests
        working-directory: app_project
        shell: bash
        run: |
          set -e
          bash tests/run_geometry_tests.sh
          mkdir -p /tmp/fm13_java_tests
          javac -encoding UTF-8 -d /tmp/fm13_java_tests app/src/main/java/com/fieldmeasure/ar/PlanGeometry.java tests/TestPlanGeometry.java tests/TestConstraintsV13.java
          java -cp /tmp/fm13_java_tests TestPlanGeometry
          java -cp /tmp/fm13_java_tests TestConstraintsV13
      - name: Build original-package Android debug APK
        working-directory: app_project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Preserve standard APK and create side-by-side preview APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp app_project/app/build/outputs/apk/debug/app-debug.apk output/FieldMeasure-v1.3-standard-debug.apk
          sed -i "s/applicationId 'com.fieldmeasure.ar'/applicationId 'com.fieldmeasure.ar.preview'/" app_project/app/build.gradle
          sed -i 's/android:label="现场测绘 FieldMeasure"/android:label="现场测绘 v1.3 预览"/' app_project/app/src/main/AndroidManifest.xml
          cd app_project
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../output/FieldMeasure-v1.3-safe-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FieldMeasure-v1.3-Both-Android-APKs
          path: output/*.apk
          if-no-files-found: error
