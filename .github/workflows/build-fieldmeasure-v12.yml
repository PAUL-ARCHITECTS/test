name: Build FieldMeasure v1.2 Parametric APK
on:
  push:
    branches:
      - fieldmeasure-v1-2-parametric
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore v1.1 baseline and apply v1.2 parametric editor
        shell: bash
        run: |
          set -euo pipefail
          cat fieldmeasure_build/part_*.b64 | base64 -d > /tmp/fieldmeasure-source.tar.xz
          echo 'b25c9144d233df08e823506ccc6edfaedd527321174b108d05127467ff6aca15  /tmp/fieldmeasure-source.tar.xz' | sha256sum -c -
          mkdir -p app_project
          tar -xJf /tmp/fieldmeasure-source.tar.xz -C app_project
          cp fieldmeasure_build/overrides/*.java app_project/app/src/main/java/com/fieldmeasure/ar/
          base64 -d fieldmeasure_build/v12_patch.tar.xz.b64 > /tmp/fieldmeasure-v12.tar.xz
          echo '8793f881fcba72cda818f5114829148039cc8385f805c4ad624e31ff9587e35a  /tmp/fieldmeasure-v12.tar.xz' | sha256sum -c -
          tar -xJf /tmp/fieldmeasure-v12.tar.xz -C app_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK available
        shell: bash
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then sdkmanager 'platforms;android-36'; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Geometry tests
        working-directory: app_project
        run: |
          bash tests/run_geometry_tests.sh
          mkdir -p /tmp/fm12_test
          javac -encoding UTF-8 -d /tmp/fm12_test app/src/main/java/com/fieldmeasure/ar/PlanGeometry.java tests/TestPlanGeometry.java
          java -cp /tmp/fm12_test TestPlanGeometry
      - name: Build Android debug APK
        working-directory: app_project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FieldMeasure-v1.2-parametric-APK
          path: app_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
