name: FieldMeasure v1.1 Android APK
on:
  push:
    branches:
      - fieldmeasure-v1-1-android
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android source
        shell: bash
        run: |
          set -euo pipefail
          cat fieldmeasure_build/part_*.b64 | base64 -d > /tmp/fieldmeasure-source.tar.xz
          echo 'b25c9144d233df08e823506ccc6edfaedd527321174b108d05127467ff6aca15  /tmp/fieldmeasure-source.tar.xz' | sha256sum -c -
          mkdir -p app_project
          tar -xJf /tmp/fieldmeasure-source.tar.xz -C app_project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK available
        shell: bash
        run: |
          set -e
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then sdkmanager 'platforms;android-36'; fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Pure Java geometry tests
        working-directory: app_project
        run: bash tests/run_geometry_tests.sh
      - name: Build Android debug APK
        working-directory: app_project
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: FieldMeasure-v1.1-debug-APK
          path: app_project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
